name: Generate WebP images

on:
  push:
    branches: [main]
    paths:
      - "assets/img/**"
      - "scripts/optimize_images.py"
      - ".github/workflows/optimize-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  webp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image optimizer
        run: python -m pip install Pillow
      - name: Generate WebP variants
        run: python scripts/optimize_images.py
      - name: Commit generated variants
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/*.webp
          if git diff --cached --quiet; then
            echo "WebP variants are already current."
            exit 0
          fi
          git commit -m "Generate optimized WebP image variants"
          git push origin HEAD:main
